version: '3.8'

services:

  # Service principal — Dev Container VSCode
  dns-measures:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-measures-env
    hostname: dns-measures
    volumes:
      - .:/workspace
      - dns-data:/workspace/data
    ports:
      - "8888:8888"   # Jupyter Lab
    environment:
      - PYTHONPATH=/workspace
      - JUPYTER_ENABLE_LAB=yes
      - RIPE_ATLAS_API_KEY=${RIPE_ATLAS_API_KEY:-}
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: bash
    # Décommenter pour limiter les ressources :
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
    #     reservations:
    #       memory: 4G

  # Service Jupyter Lab autonome (profil optionnel)
  # Démarrage : docker compose --profile jupyter up jupyter
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-measures-jupyter
    volumes:
      - .:/workspace
      - dns-data:/workspace/data
    ports:
      - "8889:8888"
    environment:
      - PYTHONPATH=/workspace
      - RIPE_ATLAS_API_KEY=${RIPE_ATLAS_API_KEY:-}
    env_file:
      - .env
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser
      --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - jupyter

volumes:
  dns-data:
